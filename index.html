<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="description" content="Jogo de navegador Jardim de Doces: aventure-se no reino das guloseimas e alcance o castelo." />
<meta name="theme-color" content="#160d2b" />
<title>Jardim de Doces — Aventura da Princesa</title>
<style>
  :root{
    --pink:#f449a6; --pink2:#ff88cf; --purple:#5b1b75; --cream:#fff2d7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160d2b;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body{display:grid;place-items:center;min-height:100dvh}
  #wrap{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#66b4ff;max-width:100%;max-height:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;-webkit-user-select:none;user-select:none}
  .topButtons{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));z-index:12;display:flex;gap:10px}
  .uiBtn{width:56px;height:56px;border:4px solid #46145e;border-radius:16px;background:linear-gradient(#a651bd,#703289);box-shadow:0 4px 0 #2e0c40,inset 0 0 0 3px #d995ea;color:white;font-size:26px;font-weight:900;display:grid;place-items:center;cursor:pointer;user-select:none}
  .uiBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #2e0c40,inset 0 0 0 3px #d995ea}
  #overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(34,11,58,.55);backdrop-filter:blur(2px)}
  .panel{width:min(700px,92vw);padding:30px 34px;border:5px solid #4b155f;border-radius:28px;background:linear-gradient(#ffc4ea,#f38fd1);box-shadow:0 10px 0 #2d0f43,0 0 0 6px #f7d5ff inset;text-align:center;color:#3d1252}
  .panel h1{margin:0 0 8px;font-size:clamp(32px,6vw,58px);letter-spacing:2px;text-shadow:3px 3px 0 #fff}
  .panel p{font:700 16px/1.5 system-ui,sans-serif;margin:8px 0 18px}
  .startBtn{border:4px solid #6b1d7b;background:linear-gradient(#fff069,#f4b51d);border-radius:18px;padding:14px 26px;font:900 22px ui-monospace,monospace;color:#572052;box-shadow:0 5px 0 #9a5a08;cursor:pointer;max-width:100%}
  .keys{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
  .key{background:#fff7ff;border:2px solid #824b95;border-radius:10px;padding:7px 10px;font:800 13px system-ui,sans-serif}
  #touch{position:absolute;inset:0;z-index:11;pointer-events:none;display:none}
  .touchGroup{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
  .touchLeft{left:max(18px,env(safe-area-inset-left))}.touchRight{right:max(18px,env(safe-area-inset-right))}
  .touchBtn{width:min(18vw,72px);height:min(18vw,72px);min-width:60px;min-height:60px;border:3px solid rgba(64,14,82,.9);border-radius:50%;background:rgba(124,55,151,.58);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);color:#fff;font-size:clamp(22px,6vw,34px);font-weight:900;display:grid;place-items:center;touch-action:none;user-select:none;cursor:pointer}
  .touchBtn.shoot{background:rgba(244,73,166,.65)}
  @media (pointer:coarse),(max-width:900px){
    #touch{display:block}
    .uiBtn{width:48px;height:48px;font-size:22px}
    .panel{padding:22px 18px;border-radius:24px}
    .panel h1{font-size:clamp(28px,8vw,42px)}
    .panel p{font-size:15px}
    .startBtn{padding:14px 18px;font-size:clamp(18px,5vw,22px);width:min(100%,320px)}
    .keys{gap:8px}
    .key{font-size:11px;padding:7px 8px}
    .touchGroup{gap:10px;bottom:calc(18px + env(safe-area-inset-bottom))}
  }
  @media (max-width:480px){
    .topButtons{gap:8px;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
    .uiBtn{width:44px;height:44px;border-width:3px;border-radius:12px;font-size:20px}
    .touchLeft{left:12px}.touchRight{right:12px}
    .touchBtn{min-width:54px;min-height:54px;width:64px;height:64px}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="Jogo Jardim de Doces"></canvas>
  <div class="topButtons">
    <button class="uiBtn" id="soundBtn" title="Som">🔊</button>
    <button class="uiBtn" id="pauseBtn" title="Pausar">Ⅱ</button>
  </div>
  <div id="touch">
    <div class="touchGroup touchLeft">
      <div class="touchBtn" data-key="left">◀</div>
      <div class="touchBtn" data-key="right">▶</div>
    </div>
    <div class="touchGroup touchRight">
      <div class="touchBtn" data-key="jump">▲</div>
      <div class="touchBtn shoot" data-key="shoot">★</div>
    </div>
  </div>
  <div id="overlay">
    <div class="panel">
      <h1>JARDIM DE DOCES</h1>
      <p>Ajude a princesa a atravessar o reino de doces, derrotar os inimigos com estrelas mágicas ou pulando sobre eles e chegar ao castelo.</p>
      <button class="startBtn" id="startBtn">▶ INICIAR AVENTURA</button>
      <div class="keys">
        <span class="key">A / ← mover</span><span class="key">D / → mover</span><span class="key">W / ↑ / Espaço pular</span><span class="key">K / X atirar</span><span class="key">P pausar</span>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');

const BASE_W=1280, BASE_H=720, WORLD_W=7600, GROUND_Y=575;
let sx=1, sy=1;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(innerWidth*dpr); canvas.height=Math.floor(innerHeight*dpr);
  sx=canvas.width/BASE_W; sy=canvas.height/BASE_H;
  ctx.setTransform(sx,0,0,sy,0,0); ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize); resize();

const state={running:false,paused:false,won:false,gameOver:false,time:0,cameraX:0,shake:0,score:0,coins:0,stars:0,kills:0,sound:true};
const keys={left:false,right:false,jump:false,shoot:false};
let prevJump=false, prevShoot=false;

// ---------- AUDIO (sem arquivos externos) ----------
let audioCtx=null;
function beep(freq=440,dur=.07,type='square',vol=.035){
  if(!state.sound)return;
  try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

// ---------- HELPERS ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
function rr(x,y,w,h,r,fill,stroke,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}}
function pxRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function circle(x,y,r,c,stroke=null,lw=2){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}}
function starPath(x,y,r1,r2,n=5,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,r=i%2?r2:r1;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
function hit(a,b){return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;}
function shadowText(text,x,y,size,align='left',fill='#fff',stroke='#2c103f'){
  ctx.font=`900 ${size}px ui-monospace,monospace`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*.12);ctx.strokeStyle=stroke;ctx.strokeText(text,x,y);ctx.fillStyle=fill;ctx.fillText(text,x,y);
}

// ---------- LEVEL ----------
const platforms=[
 {x:0,y:GROUND_Y,w:920,h:145},{x:980,y:GROUND_Y-90,w:330,h:235},{x:1370,y:GROUND_Y,w:520,h:145},
 {x:1970,y:GROUND_Y-60,w:360,h:205},{x:2410,y:GROUND_Y,w:650,h:145},{x:3170,y:GROUND_Y-120,w:300,h:265},
 {x:3540,y:GROUND_Y,w:560,h:145},{x:4200,y:GROUND_Y-70,w:330,h:215},{x:4620,y:GROUND_Y,w:470,h:145},
 {x:5190,y:GROUND_Y-110,w:360,h:255},{x:5650,y:GROUND_Y,w:610,h:145},{x:6360,y:GROUND_Y-65,w:340,h:210},
 {x:6770,y:GROUND_Y,w:830,h:145}
];
const candyPads=[{x:690,y:470,w:110,h:24},{x:1490,y:410,w:125,h:24},{x:2780,y:425,w:130,h:24},{x:3730,y:400,w:140,h:24},{x:4820,y:430,w:130,h:24},{x:5920,y:390,w:150,h:24}];
const coins=[]; const starCollect=[];
function seedCollectibles(){coins.length=0;starCollect.length=0;
  const groups=[[320,500,6],[1050,410,5],[1450,485,6],[2070,430,5],[2580,485,7],[3240,370,5],[3660,485,7],[4260,420,5],[4680,485,6],[5260,360,5],[5750,485,7],[6410,420,5],[6940,485,8]];
  groups.forEach(([x,y,n])=>{for(let i=0;i<n;i++)coins.push({x:x+i*45,y:y-(i%2)*24,w:24,h:28,taken:false,bob:Math.random()*6.2});});
  [780,1700,2990,3990,5010,6160,7210].forEach((x,i)=>starCollect.push({x,y:i%2?370:430,w:28,h:28,taken:false,bob:Math.random()*6.2}));
}
seedCollectibles();

const enemyDefs=[
 ['cookie',650,GROUND_Y-52],['cotton',1115,GROUND_Y-172],['cookie',1530,GROUND_Y-52],['cookie',1815,GROUND_Y-52],
 ['cotton',2100,GROUND_Y-142],['cookie',2700,GROUND_Y-52],['cupcake',2920,GROUND_Y-58],['cotton',3280,GROUND_Y-205],
 ['cookie',3850,GROUND_Y-52],['cotton',4310,GROUND_Y-153],['cupcake',4720,GROUND_Y-58],['cookie',4990,GROUND_Y-52],
 ['cookie',5350,GROUND_Y-162],['cotton',5820,GROUND_Y-82],['cupcake',6070,GROUND_Y-58],['cookie',6500,GROUND_Y-117],['cotton',6900,GROUND_Y-82]
];
let enemies=[];
function makeEnemy(type,x,y){const size=type==='cotton'?68:type==='cupcake'?58:56;return {type,x,y,w:size,h:size,vx:type==='cotton'?-50:-65,vy:0,dir:-1,alive:true,death:0,baseY:y,phase:Math.random()*10,hp:type==='cupcake'?2:1};}
function resetEnemies(){enemies=enemyDefs.map(e=>makeEnemy(...e));}
resetEnemies();

const projectiles=[],particles=[],floatTexts=[];
function particle(x,y,c,n=8,s=4){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-150,150),vy:rand(-220,-40),life:rand(.35,.75),max:1,size:rand(2,s),c});}
function popText(text,x,y,c='#fff'){floatTexts.push({text,x,y,life:1,c});}

const player={x:120,y:GROUND_Y-78,w:52,h:72,vx:0,vy:0,onGround:false,facing:1,hearts:3,maxHearts:3,inv:0,shootCd:0,anim:0,respawnX:120,respawnY:GROUND_Y-78};
function resetGame(){Object.assign(state,{running:true,paused:false,won:false,gameOver:false,time:0,cameraX:0,shake:0,score:0,coins:0,stars:0,kills:0});Object.assign(player,{x:120,y:GROUND_Y-78,vx:0,vy:0,onGround:false,facing:1,hearts:3,inv:0,shootCd:0,respawnX:120,respawnY:GROUND_Y-78});projectiles.length=0;particles.length=0;floatTexts.length=0;seedCollectibles();resetEnemies();}

// ---------- CONTROLS ----------
function setKey(code,val){
 if(['ArrowLeft','KeyA'].includes(code)) keys.left=val;
 if(['ArrowRight','KeyD'].includes(code)) keys.right=val;
 if(['ArrowUp','KeyW','Space'].includes(code)) keys.jump=val;
 if(['KeyK','KeyX','KeyJ'].includes(code)) keys.shoot=val;
 if(code==='KeyP' && val && state.running){state.paused=!state.paused;pauseBtn.textContent=state.paused?'▶':'Ⅱ';}
}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();setKey(e.code,true)});
addEventListener('keyup',e=>setKey(e.code,false));
document.querySelectorAll('.touchBtn').forEach(btn=>{
 const k=btn.dataset.key; const on=e=>{e.preventDefault();keys[k]=true}; const off=e=>{e.preventDefault();keys[k]=false};
 btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
});
startBtn.onclick=()=>{overlay.style.display='none';resetGame();beep(660,.08,'square');};
pauseBtn.onclick=()=>{if(!state.running)return;state.paused=!state.paused;pauseBtn.textContent=state.paused?'▶':'Ⅱ';};
soundBtn.onclick=()=>{state.sound=!state.sound;soundBtn.textContent=state.sound?'🔊':'🔇';};

// ---------- PHYSICS ----------
function platformUnder(x,y,w,h){
 let result=null;
 for(const p of [...platforms,...candyPads]){
  if(x+w>p.x && x<p.x+p.w && y+h<=p.y+18 && y+h>=p.y-20) {if(!result||p.y<result.y)result=p;}
 }
 return result;
}
function damagePlayer(fromX){
 if(player.inv>0||state.won)return; player.hearts--; player.inv=1.55;player.vy=-430;player.vx=(player.x<fromX?-1:1)*300;state.shake=10;particle(player.x+26,player.y+34,'#ff5a9f',14,6);beep(140,.18,'sawtooth',.05);
 if(player.hearts<=0){state.gameOver=true;state.running=false;setTimeout(()=>{overlay.style.display='grid';overlay.querySelector('h1').textContent='TENTE NOVAMENTE';overlay.querySelector('p').textContent='Os doces venceram desta vez. Volte ao Jardim de Doces e chegue ao castelo!';startBtn.textContent='↻ RECOMEÇAR';},500);}
}
function killEnemy(e,stomp=false){if(!e.alive)return;e.alive=false;e.death=.5;state.kills++;state.score+=stomp?250:200;particle(e.x+e.w/2,e.y+e.h/2,e.type==='cookie'?'#c8792b':e.type==='cotton'?'#ff8ed1':'#9b55c4',18,8);popText(stomp?'+250 PULO!':'+200',e.x+e.w/2,e.y,'#fff16e');beep(stomp?640:760,.09,'square');}
function shoot(){if(player.shootCd>0)return;player.shootCd=.28;projectiles.push({x:player.x+(player.facing>0?46:-10),y:player.y+26,w:24,h:24,vx:player.facing*720,life:1.6,rot:0});particle(player.x+player.w/2,player.y+28,'#fff36a',5,4);beep(880,.05,'square',.03);}

function update(dt){
 if(!state.running||state.paused)return; state.time+=dt;player.anim+=dt;player.inv=Math.max(0,player.inv-dt);player.shootCd=Math.max(0,player.shootCd-dt);state.shake=Math.max(0,state.shake-dt*28);
 // movement
 const accel=player.onGround?1750:1150, max=300, friction=player.onGround?0.78:0.94;
 if(keys.left){player.vx-=accel*dt;player.facing=-1} if(keys.right){player.vx+=accel*dt;player.facing=1}
 if(!keys.left&&!keys.right)player.vx*=Math.pow(friction,dt*60);player.vx=clamp(player.vx,-max,max);
 if(keys.jump&&!prevJump&&player.onGround){player.vy=-690;player.onGround=false;beep(510,.07,'square');particle(player.x+26,player.y+player.h,'#ffd6ef',7,5)}
 if(keys.shoot&&!prevShoot)shoot(); prevJump=keys.jump;prevShoot=keys.shoot;
 const oldY=player.y;player.vy+=1800*dt;player.vy=Math.min(player.vy,980);player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=clamp(player.x,0,WORLD_W-player.w);
 player.onGround=false;
 for(const p of [...platforms,...candyPads]){
  const wasBottom=oldY+player.h, nowBottom=player.y+player.h;
  if(player.x+player.w>p.x+4&&player.x<p.x+p.w-4&&wasBottom<=p.y+8&&nowBottom>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}
 }
 if(player.y>BASE_H+180){player.hearts--;if(player.hearts<=0){damagePlayer(player.x+100)}else{player.x=player.respawnX;player.y=player.respawnY;player.vx=0;player.vy=0;player.inv=1;beep(160,.2,'sawtooth')}}
 // checkpoints implied by progress
 if(player.x>2500&&player.respawnX<2500){player.respawnX=2520;player.respawnY=GROUND_Y-78;popText('CHECKPOINT!',player.x,player.y-30,'#84ffcf')}
 if(player.x>5100&&player.respawnX<5100){player.respawnX=5670;player.respawnY=GROUND_Y-78;popText('CHECKPOINT!',player.x,player.y-30,'#84ffcf')}
 // collectibles
 for(const c of coins){if(!c.taken&&hit(player,c)){c.taken=true;state.coins++;state.score+=25;particle(c.x+12,c.y+12,'#ffd43b',6,4);beep(1040,.04,'square',.025)}}
 for(const s of starCollect){if(!s.taken&&hit(player,s)){s.taken=true;state.stars++;state.score+=100;particle(s.x+14,s.y+14,'#ff7a6f',10,6);beep(1250,.08,'square',.03)}}
 // enemies
 for(const e of enemies){
  if(!e.alive){e.death-=dt;continue}
  if(e.type==='cotton'){e.x+=e.vx*dt;e.y=e.baseY+Math.sin(state.time*2.5+e.phase)*28; if(e.x<e.baseX-80||e.x>e.baseX+80)e.vx*=-1;}
  else{e.vy+=1600*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;const floor=platformUnder(e.x,e.y,e.w,e.h);if(floor&&e.vy>=0){e.y=floor.y-e.h;e.vy=0;const aheadX=e.x+(e.vx>0?e.w+8:-8);const support=platformUnder(aheadX,e.y,4,e.h);if(!support)e.vx*=-1;} if(Math.random()<.002)e.vx*=-1;}
  e.dir=Math.sign(e.vx)||e.dir;
  if(hit(player,e)&&player.inv<=0){const prevBottom=oldY+player.h;if(player.vy>120 && prevBottom<=e.y+20){killEnemy(e,true);player.vy=-500;}else damagePlayer(e.x+e.w/2)}
 }
 // projectiles
 for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.x+=p.vx*dt;p.rot+=dt*10;p.life-=dt;let remove=p.life<=0||p.x<0||p.x>WORLD_W;
  for(const e of enemies){if(e.alive&&hit(p,e)){e.hp--;particle(p.x+12,p.y+12,'#fff56a',8,5);if(e.hp<=0)killEnemy(e,false);else{popText('CRACK!',e.x,e.y,'#fff');beep(420,.06,'square')}remove=true;break;}}
  if(remove)projectiles.splice(i,1);
 }
 // particles
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1)}
 for(let i=floatTexts.length-1;i>=0;i--){const f=floatTexts[i];f.life-=dt;f.y-=45*dt;if(f.life<=0)floatTexts.splice(i,1)}
 // win
 if(player.x>7240&&!state.won){state.won=true;state.running=false;state.score+=1000+player.hearts*300;beep(880,.12);setTimeout(()=>beep(1100,.15),120);setTimeout(()=>beep(1320,.2),260);setTimeout(()=>{overlay.style.display='grid';overlay.querySelector('h1').textContent='CASTELO ALCANÇADO!';overlay.querySelector('p').textContent=`Vitória! Pontuação: ${state.score} • Moedas: ${state.coins} • Estrelas: ${state.stars} • Inimigos: ${state.kills}`;startBtn.textContent='★ JOGAR NOVAMENTE';},700)}
 // camera
 const target=clamp(player.x-BASE_W*.36,0,WORLD_W-BASE_W);state.cameraX=lerp(state.cameraX,target,1-Math.pow(.0003,dt));
}

// set baseX for flyers
enemies.forEach(e=>e.baseX=e.x);
const _resetEnemies=resetEnemies; resetEnemies=function(){enemies=enemyDefs.map(e=>{const o=makeEnemy(...e);o.baseX=o.x;return o;});};

// ---------- PIXEL ART DRAWING ----------

function drawCloud(x,y,s=1){
 const c='#ffe7fb',hi='#fff8ff',sh='#efc4ea';
 pxRect(x+18*s,y+20*s,108*s,24*s,sh);
 circle(x+34*s,y+28*s,24*s,c);circle(x+63*s,y+16*s,33*s,c);circle(x+100*s,y+27*s,24*s,c);circle(x+82*s,y+34*s,18*s,c);
 pxRect(x+30*s,y+14*s,56*s,8*s,hi);
}
function drawMountain(x,y,s,c1='#bb79cf',c2='#ffe3f8'){
 ctx.fillStyle=c1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+125*s,y-170*s);ctx.lineTo(x+250*s,y);ctx.closePath();ctx.fill();

function drawBackground(cam){

 // nuvens

 // composição simples inspirada na imagem enviada

     ['tree',620,300,.84],
     ['lolli',930,278,1.0,'#ff9249'],
     ['lolli',785,370,.56,'#a774ee'],
     ['lolli',1008,388,.42,'#b3d656'],
     ['lolli',1186,362,.54,'#8dce56'],

 }
}

function drawPrincess(x,y,flip=1,scale=1,blink=false,walkFrame=0,walking=false){
 // Animação simples de caminhada em 2 quadros:
 // pernas alternam, o vestido balança e o corpo sobe 1 pixel.
 const step = walking ? (walkFrame ? 1 : -1) : 0;
 const bob = walking && walkFrame ? -1 : 0;
 const legShift = walking ? 4 : 0;

 ctx.save();
 ctx.translate(x+(flip<0?52*scale:0),y+bob*scale);
 ctx.scale(flip*scale,scale);

 // cabelo de trás — desloca levemente ao andar
 circle(24-step,35,22,'#d98900','#8f4b0b',3);
 pxRect(7-step,31,15,35,'#d98d07');
 pxRect(13-step,55,8,18,'#bd6e04');
 pxRect(38+step,34,12,29,'#bf7002');

 // corpo / vestido
 pxRect(14,38,28,26,'#f3489b');
 pxRect(10-step,60,36+Math.abs(step),12,'#f067b1');
 pxRect(7-step*2,69,42+Math.abs(step)*2,7,'#d83b8c');
 pxRect(15,47,5,13,'#ff8fc8');

 // pernas e botas alternadas — principal movimento da caminhada
 const leftLegX = 15 + (walking ? step*legShift : 0);
 const rightLegX = 34 - (walking ? step*legShift : 0);
 const leftBootX = 12 + (walking ? step*legShift : 0);
 const rightBootX = 32 - (walking ? step*legShift : 0);
 const leftLegY = 75 + (walking && step<0 ? 1 : 0);
 const rightLegY = 75 + (walking && step>0 ? 1 : 0);
 pxRect(leftLegX,leftLegY,9,7,'#ffd4a7');
 pxRect(rightLegX,rightLegY,9,7,'#ffd4a7');
 pxRect(leftBootX,81+(walking&&step<0?1:0),13,5,'#8a3c69');
 pxRect(rightBootX,81+(walking&&step>0?1:0),13,5,'#8a3c69');

 // cabeça
 circle(28,23,16,'#ffd2a2','#9b4f1d',2);
 pxRect(15,12,27,8,'#f3a700');
 pxRect(11,16,8,14,'#ef9c00');
 pxRect(38,16,7,15,'#cd7900');

 // olhos
 if(blink){pxRect(20,24,6,2,'#5b2a33');pxRect(33,24,6,2,'#5b2a33')}
 else{pxRect(21,20,5,8,'#2b1741');pxRect(34,20,5,8,'#2b1741');pxRect(22,20,2,2,'#fff');pxRect(35,20,2,2,'#fff')}
 pxRect(27,31,7,3,'#cf4d59');pxRect(29,31,3,1,'#fff');

 // coroa
 pxRect(17,5,24,8,'#f0b313');pxRect(19,0,5,8,'#ffde3f');pxRect(28,-3,5,11,'#ffd836');pxRect(37,1,5,7,'#ffdc43');pxRect(27,3,7,4,'#ff4b9d');

 // braço e varinha — sobe/desce discretamente com os passos
 const armY = 43 + (walking ? step : 0);
 const wandY = 30 + (walking ? step*2 : 0);
 pxRect(39,armY,14,7,'#ffd2a2');
 ctx.strokeStyle='#7d4023';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(50,47+(walking?step:0));ctx.lineTo(67,wandY);ctx.stroke();
 starPath(70,wandY-3,9,4);ctx.fillStyle='#ffe64f';ctx.fill();ctx.strokeStyle='#f3a300';ctx.lineWidth=2;ctx.stroke();

 // detalhes do contorno do vestido
 pxRect(8-step*2,70,3,6,'#7e285f');pxRect(46+step*2,68,3,7,'#7e285f');
 ctx.restore();
}

 const blink=player.inv>0 && Math.floor(player.inv*12)%2===0;const walking=player.onGround&&Math.abs(player.vx)>28;const walkFrame=walking?Math.floor(player.anim*9)%2:0;if(!blink)drawPrincess(player.x-state.cameraX,player.y,player.facing,1,Math.floor(state.time*2.2)%15===0,walkFrame,walking);

 if(state.paused){ctx.fillStyle='rgba(30,8,46,.45)';ctx.fillRect(0,0,BASE_W,BASE_H);shadowText('PAUSADO',BASE_W/2,BASE_H/2,64,'center','#fff','#52116c');shadowText('Pressione P ou ▶ para continuar',BASE_W/2,BASE_H/2+60,22,'center','#ffe3fa','#52116c')}
 ctx.restore();
}

// idle preview
resetGame();state.running=false;state.cameraX=0;
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
